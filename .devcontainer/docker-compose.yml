# Dev container stack. Credentials are throwaway demo values (local/Codespaces only).
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      ENV: local
      DATABASE_URL: postgresql+psycopg://app_user:app_user_dev@postgres:5432/vidyatrack
      MIGRATION_DATABASE_URL: postgresql+psycopg://vidya_owner:vidya_owner_dev@postgres:5432/vidyatrack
      TEST_DATABASE_URL: postgresql+psycopg://app_user:app_user_dev@postgres:5432/vidyatrack_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://vidya_owner:vidya_owner_dev@postgres:5432/vidyatrack_test
      REDIS_URL: redis://redis:6379/0
      DEV_OTP_ENABLED: "true"
      API_URL: http://localhost:8000
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vidya_owner
      POSTGRES_PASSWORD: vidya_owner_dev
      POSTGRES_DB: vidyatrack
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
